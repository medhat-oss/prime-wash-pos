# ==============================================================================
# Production Nginx Configuration for Car Wash ERP & POS
# Compatible with Cloudflare Full (Strict) SSL & Standalone SSL
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 50M;

    # Logging format with Cloudflare CF-Connecting-IP support
    log_format cloudflare '$http_cf_connecting_ip - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log cloudflare;

    # Rate Limiting Zone for API protection
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_status 429;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Upstream Node.js Application Server
    upstream carwash_backend {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # 1. HTTP Server - Redirect to HTTPS
    # --------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name example.com www.example.com;

        # Health check endpoint without SSL redirect for container/load balancer probes
        location /health {
            proxy_pass http://carwash_backend/health;
            access_log off;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --------------------------------------------------------------------------
    # 2. HTTPS Production Server
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name example.com www.example.com;

        # SSL Certificates (Cloudflare Origin CA or Let's Encrypt Certbot)
        ssl_certificate /etc/ssl/certs/carwash.crt;
        ssl_certificate_key /etc/ssl/private/carwash.key;

        # Modern SSL Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Proxy Common Headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # ----------------------------------------------------------------------
        # A. API Endpoints with Rate Limiting
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://carwash_backend;
            proxy_read_timeout 90s;
            proxy_connect_timeout 90s;
        }

        # ----------------------------------------------------------------------
        # B. Media Uploads with Long-term Caching
        # ----------------------------------------------------------------------
        location /uploads/ {
            proxy_pass http://carwash_backend;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # ----------------------------------------------------------------------
        # C. Static Frontend Assets Caching (Vite hashed bundles)
        # ----------------------------------------------------------------------
        location ~* \.(?:css|js|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico|webp|mp4)$ {
            proxy_pass http://carwash_backend;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ----------------------------------------------------------------------
        # D. Single Page Application (SPA) Root & Fallback
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://carwash_backend;
        }
    }
}
